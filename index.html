<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neon Grid Defense</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }
    /* 상단 상태바 */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #111827;
      border-bottom: 1px solid #1e293b;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .stat {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .gold { color: #fbbf24; }
    .income { color: #34d399; font-size: 11px; font-weight: 600; }
    .life { color: #f87171; }
    .wave { color: #38bdf8; }
    .top-btns {
      display: flex;
      gap: 6px;
    }
    button.mini-btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    button.mini-btn.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: #fff;
    }

    /* 게임 캔버스 영역 */
    #game-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 6px;
      overflow: hidden;
    }
    canvas {
      background: #0f172a;
      border: 2px solid #1e293b;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
      touch-action: none;
    }

    /* 오버레이 (게임 오버 / 시작) */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 14px;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: 26px;
      color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
    }
    #overlay p {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
    }
    #start-btn {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    /* 하단 컨트롤 패널 */
    #controls {
      background: #111827;
      border-top: 1px solid #1e293b;
      padding: 8px 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    /* 채굴기 투자 바 */
    #mine-btn {
      width: 100%;
      background: linear-gradient(90deg, #064e3b, #0f172a);
      border: 1px solid #10b981;
      border-radius: 8px;
      padding: 7px 12px;
      color: #ecfdf5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    #mine-btn:active { transform: scale(0.98); }
    #mine-btn:disabled {
      opacity: 0.5;
      border-color: #334155;
      background: #1e293b;
    }
    .mine-cost { color: #fbbf24; }

    .tower-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .tower-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    .tower-card:active { transform: scale(0.96); }
    .tower-card.selected {
      border-color: #38bdf8;
      background: #172554;
    }
    .tower-card .name {
      font-size: 13px;
      font-weight: 700;
    }
    .tower-card .desc {
      font-size: 10px;
      color: #94a3b8;
    }
    .tower-card .cost {
      font-size: 12px;
      font-weight: 700;
      color: #fbbf24;
    }

    /* 선택된 타워 업그레이드 패널 */
    #upgrade-bar {
      display: none;
      grid-template-columns: 1.5fr 1fr 0.7fr;
      gap: 8px;
    }
    #upgrade-bar.active { display: grid; }
    .action-btn {
      border: none;
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
    }
    #btn-upgrade { background: #059669; }
    #btn-upgrade:disabled { background: #334155; color: #64748b; }
    #btn-sell { background: #dc2626; }
    #btn-close { background: #475569; }
  </style>
</head>
<body>

  <div id="hud">
    <div class="stat wave">WAVE <span id="ui-wave">1</span></div>
    <div class="stat gold">
      💰 <span id="ui-gold">220</span>
      <span class="income">(+<span id="ui-income">2</span>/s)</span>
    </div>
    <div class="stat life">❤️ <span id="ui-life">20</span></div>
    <div class="top-btns">
      <button class="mini-btn" id="btn-speed">1x</button>
      <button class="mini-btn" id="btn-wave">다음 웨이브</button>
    </div>
  </div>

  <div id="game-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h1 id="ov-title">NEON DEFENSE</h1>
      <p id="ov-desc">빈 칸을 터치해 타워를 건설하고<br>채굴기에 투자해 초당 골드 수입을 늘리세요!</p>
      <button id="start-btn">게임 시작</button>
    </div>
  </div>

  <div id="controls">
    <!-- 초당 골드 채굴기 업그레이드 버튼 -->
    <button id="mine-btn">
      <span>⛏️ 골드 채굴기 Lv.<span id="ui-mine-lv">1</span> (초당 +<span id="ui-mine-rate">2</span>G)</span>
      <span class="mine-cost">투자 💰 <span id="ui-mine-cost">60</span></span>
    </button>

    <!-- 타워 건설 선택 -->
    <div class="tower-bar" id="build-bar">
      <div class="tower-card selected" data-type="blaster">
        <span class="name" style="color:#38bdf8;">● 블래스터</span>
        <span class="desc">빠른 연사 / 균형</span>
        <span class="cost">💰 50</span>
      </div>
      <div class="tower-card" data-type="frost">
        <span class="name" style="color:#a5f3fc;">❄ 프로스트</span>
        <span class="desc">이동속도 45% 감소</span>
        <span class="cost">💰 70</span>
      </div>
      <div class="tower-card" data-type="sniper">
        <span class="name" style="color:#f472b6;">▲ 레이저</span>
        <span class="desc">초장거리 / 고화력</span>
        <span class="cost">💰 95</span>
      </div>
    </div>

    <!-- 설치된 타워 관리 -->
    <div id="upgrade-bar">
      <button class="action-btn" id="btn-upgrade">업그레이드 (💰 60)</button>
      <button class="action-btn" id="btn-sell">판매 (+💰 35)</button>
      <button class="action-btn" id="btn-close">취소</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const wrap = document.getElementById('game-wrap');

    const COLS = 10;
    const ROWS = 12;
    let cellSize = 32;

    const WAYPOINTS = [
      { c: 0, r: 1 }, { c: 8, r: 1 },
      { c: 8, r: 4 }, { c: 1, r: 4 },
      { c: 1, r: 7 }, { c: 8, r: 7 },
      { c: 8, r: 10 }, { c: 2, r: 10 },
      { c: 2, r: 11 }
    ];

    const pathSet = new Set();
    for (let i = 0; i < WAYPOINTS.length - 1; i++) {
      const a = WAYPOINTS[i];
      const b = WAYPOINTS[i + 1];
      const minC = Math.min(a.c, b.c), maxC = Math.max(a.c, b.c);
      const minR = Math.min(a.r, b.r), maxR = Math.max(a.r, b.r);
      for (let c = minC; c <= maxC; c++) {
        for (let r = minR; r <= maxR; r++) {
          pathSet.add(`${c},${r}`);
        }
      }
    }

    // 타워 스펙 (상향 조정)
    const TOWER_TYPES = {
      blaster: { name: '블래스터', cost: 50, range: 2.7, damage: 22, cooldown: 0.42, color: '#38bdf8', projSpeed: 9, slow: 0 },
      frost:   { name: '프로스트', cost: 70, range: 2.5, damage: 12, cooldown: 0.70, color: '#67e8f9', projSpeed: 8, slow: 0.45 },
      sniper:  { name: '레이저',   cost: 95, range: 4.6, damage: 75, cooldown: 1.25, color: '#f472b6', projSpeed: 15, slow: 0 }
    };

    // 게임 상태
    let gold = 220;
    let life = 20;
    let wave = 1;
    let gameSpeed = 1;
    let isRunning = false;
    let selectedBuildType = 'blaster';
    let selectedTower = null;

    // 골드 채굴기 상태
    let mineLevel = 1;
    let goldPerSec = 2;
    let mineAccumulator = 0;

    let towers = [];
    let enemies = [];
    let projectiles = [];
    let particles = [];
    let floatingTexts = [];

    let waveInProgress = false;
    let spawnQueue = 0;
    let spawnTimer = 0;
    let spawnInterval = 0.8;

    function resizeCanvas() {
      const maxW = wrap.clientWidth - 12;
      const maxH = wrap.clientHeight - 12;
      cellSize = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
      canvas.width = cellSize * COLS;
      canvas.height = cellSize * ROWS;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // UI 요소
    const uiWave = document.getElementById('ui-wave');
    const uiGold = document.getElementById('ui-gold');
    const uiIncome = document.getElementById('ui-income');
    const uiLife = document.getElementById('ui-life');
    const uiMineLv = document.getElementById('ui-mine-lv');
    const uiMineRate = document.getElementById('ui-mine-rate');
    const uiMineCost = document.getElementById('ui-mine-cost');
    const mineBtn = document.getElementById('mine-btn');

    const btnSpeed = document.getElementById('btn-speed');
    const btnWave = document.getElementById('btn-wave');
    const buildBar = document.getElementById('build-bar');
    const upgradeBar = document.getElementById('upgrade-bar');
    const btnUpgrade = document.getElementById('btn-upgrade');
    const btnSell = document.getElementById('btn-sell');
    const btnClose = document.getElementById('btn-close');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('start-btn');

    function getMineUpgradeCost() {
      return Math.floor(60 * Math.pow(1.45, mineLevel - 1));
    }

    function getUpgradeCost(t) {
      return Math.floor(t.baseCost * Math.pow(1.4, t.level));
    }

    function updateHUD() {
      uiWave.textContent = wave;
      uiGold.textContent = gold;
      uiIncome.textContent = goldPerSec;
      uiLife.textContent = life;

      const mCost = getMineUpgradeCost();
      uiMineLv.textContent = mineLevel;
      uiMineRate.textContent = goldPerSec;
      uiMineCost.textContent = mCost;
      mineBtn.disabled = gold < mCost;

      btnWave.style.opacity = waveInProgress ? '0.4' : '1';
      if (selectedTower) {
        const upgCost = getUpgradeCost(selectedTower);
        const sellVal = Math.floor(selectedTower.totalInvested * 0.75);
        btnUpgrade.textContent = selectedTower.level >= 5 ? 'MAX 레벨' : `강화 Lv.${selectedTower.level + 1} (💰${upgCost})`;
        btnUpgrade.disabled = selectedTower.level >= 5 || gold < upgCost;
        btnSell.textContent = `판매 (+💰${sellVal})`;
      }
    }

    function addFloatingText(x, y, text, color = '#fff') {
      floatingTexts.push({ x, y, text, color, life: 0.9 });
    }

    function spawnParticles(x, y, color, count = 6) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 2.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          color,
          life: 0.35 + Math.random() * 0.2
        });
      }
    }

    // 채굴기 투자 이벤트
    mineBtn.addEventListener('click', () => {
      if (!isRunning) return;
      const cost = getMineUpgradeCost();
      if (gold < cost) return;
      gold -= cost;
      mineLevel++;
      goldPerSec += 2 + Math.floor(mineLevel * 0.5);
      addFloatingText(canvas.width / 2, canvas.height - 30, `채굴기 Lv.${mineLevel}! (+${goldPerSec}G/s)`, '#34d399');
      updateHUD();
    });

    // 웨이브 시작
    function startWave() {
      if (waveInProgress || !isRunning) return;
      waveInProgress = true;
      const isBoss = wave % 5 === 0;
      spawnQueue = isBoss ? 3 : 5 + Math.floor(wave * 1.4);
      spawnInterval = isBoss ? 1.3 : Math.max(0.35, 0.85 - wave * 0.025);
      spawnTimer = 0;
      updateHUD();
    }

    // 적 스폰 (난이도 완화 적용)
    function spawnEnemy() {
      const isBoss = wave % 5 === 0;
      const baseHp = 32 * Math.pow(1.20, wave - 1);
      const hp = isBoss ? baseHp * 3.4 : baseHp;
      const speed = isBoss ? 1.05 : Math.min(2.5, 1.3 + wave * 0.035);
      const reward = isBoss ? 40 + wave * 4 : 11 + Math.floor(wave * 1.3);

      enemies.push({
        wpIndex: 0,
        x: (WAYPOINTS[0].c + 0.5) * cellSize,
        y: (WAYPOINTS[0].r + 0.5) * cellSize,
        hp,
        maxHp: hp,
        speed,
        slowTimer: 0,
        slowFactor: 0,
        reward,
        isBoss,
        progress: 0
      });
    }

    canvas.addEventListener('pointerdown', (e) => {
      if (!isRunning) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const c = Math.floor(x / cellSize);
      const r = Math.floor(y / cellSize);

      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return;

      const existing = towers.find(t => t.c === c && t.r === r);
      if (existing) {
        selectedTower = existing;
        buildBar.style.display = 'none';
        upgradeBar.classList.add('active');
        updateHUD();
        return;
      }

      if (selectedTower) {
        closeUpgradeBar();
        return;
      }

      if (pathSet.has(`${c},${r}`)) {
        addFloatingText((c + 0.5) * cellSize, (r + 0.5) * cellSize, '건설 불가', '#f87171');
        return;
      }

      const spec = TOWER_TYPES[selectedBuildType];
      if (gold < spec.cost) {
        addFloatingText((c + 0.5) * cellSize, (r + 0.5) * cellSize, '골드 부족!', '#fbbf24');
        return;
      }

      gold -= spec.cost;
      towers.push({
        c, r,
        x: (c + 0.5) * cellSize,
        y: (r + 0.5) * cellSize,
        type: selectedBuildType,
        baseCost: spec.cost,
        totalInvested: spec.cost,
        level: 1,
        range: spec.range,
        damage: spec.damage,
        cooldown: spec.cooldown,
        timer: 0,
        angle: 0,
        color: spec.color,
        projSpeed: spec.projSpeed,
        slow: spec.slow
      });
      spawnParticles((c + 0.5) * cellSize, (r + 0.5) * cellSize, spec.color, 8);
      updateHUD();
    });

    function closeUpgradeBar() {
      selectedTower = null;
      upgradeBar.classList.remove('active');
      buildBar.style.display = 'grid';
    }

    document.querySelectorAll('.tower-card').forEach(card => {
      card.addEventListener('click', () => {
        document.querySelectorAll('.tower-card').forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
        selectedBuildType = card.dataset.type;
      });
    });

    btnUpgrade.addEventListener('click', () => {
      if (!selectedTower || selectedTower.level >= 5) return;
      const cost = getUpgradeCost(selectedTower);
      if (gold < cost) return;
      gold -= cost;
      selectedTower.totalInvested += cost;
      selectedTower.level++;
      selectedTower.damage = Math.round(selectedTower.damage * 1.45);
      selectedTower.range += 0.22;
      selectedTower.cooldown *= 0.92;
      spawnParticles(selectedTower.x, selectedTower.y, '#34d399', 10);
      addFloatingText(selectedTower.x, selectedTower.y - 10, `Lv.${selectedTower.level}!`, '#34d399');
      updateHUD();
    });

    btnSell.addEventListener('click', () => {
      if (!selectedTower) return;
      const refund = Math.floor(selectedTower.totalInvested * 0.75);
      gold += refund;
      spawnParticles(selectedTower.x, selectedTower.y, '#f87171', 8);
      addFloatingText(selectedTower.x, selectedTower.y, `+${refund}G`, '#fbbf24');
      towers = towers.filter(t => t !== selectedTower);
      closeUpgradeBar();
      updateHUD();
    });

    btnClose.addEventListener('click', closeUpgradeBar);

    btnSpeed.addEventListener('click', () => {
      gameSpeed = gameSpeed === 1 ? 2 : 1;
      btnSpeed.textContent = `${gameSpeed}x`;
      btnSpeed.classList.toggle('active', gameSpeed === 2);
    });

    btnWave.addEventListener('click', startWave);

    startBtn.addEventListener('click', () => {
      gold = 220;
      life = 20;
      wave = 1;
      mineLevel = 1;
      goldPerSec = 2;
      mineAccumulator = 0;
      towers = [];
      enemies = [];
      projectiles = [];
      particles = [];
      floatingTexts = [];
      waveInProgress = false;
      closeUpgradeBar();
      isRunning = true;
      overlay.classList.add('hidden');
      updateHUD();
      startWave();
    });

    function update(dt) {
      if (!isRunning) return;

      // 초당 자동 골드 생산 (웨이브 진행 중일 때 작동)
      if (waveInProgress) {
        mineAccumulator += dt;
        if (mineAccumulator >= 1.0) {
          mineAccumulator -= 1.0;
          gold += goldPerSec;
          updateHUD();
        }
      }

      // 적 스폰
      if (waveInProgress) {
        if (spawnQueue > 0) {
          spawnTimer -= dt;
          if (spawnTimer <= 0) {
            spawnEnemy();
            spawnQueue--;
            spawnTimer = spawnInterval;
          }
        } else if (enemies.length === 0) {
          waveInProgress = false;
          const bonus = 25 + wave * 6;
          gold += bonus;
          addFloatingText(canvas.width / 2, canvas.height / 2, `WAVE ${wave} 클리어! +${bonus}G`, '#38bdf8');
          wave++;
          updateHUD();
        }
      }

      // 적 이동
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (e.slowTimer > 0) e.slowTimer -= dt;
        const curSpeed = e.speed * (e.slowTimer > 0 ? (1 - e.slowFactor) : 1) * cellSize;

        const targetWp = WAYPOINTS[e.wpIndex + 1];
        if (!targetWp) {
          life--;
          enemies.splice(i, 1);
          updateHUD();
          if (life <= 0) {
            isRunning = false;
            document.getElementById('ov-title').textContent = 'GAME OVER';
            document.getElementById('ov-desc').innerHTML = `도달 웨이브: <b>WAVE ${wave}</b><br>다시 도전해보세요!`;
            startBtn.textContent = '다시 시작';
            overlay.classList.remove('hidden');
          }
          continue;
        }

        const tx = (targetWp.c + 0.5) * cellSize;
        const ty = (targetWp.r + 0.5) * cellSize;
        const dx = tx - e.x;
        const dy = ty - e.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= curSpeed * dt) {
          e.x = tx;
          e.y = ty;
          e.wpIndex++;
          e.progress += dist;
        } else {
          e.x += (dx / dist) * curSpeed * dt;
          e.y += (dy / dist) * curSpeed * dt;
          e.progress += curSpeed * dt;
        }
      }

      // 타워 공격
      for (const t of towers) {
        t.timer -= dt;
        const rangePx = t.range * cellSize;
        let target = null;
        let maxProg = -1;

        for (const e of enemies) {
          const d = Math.hypot(e.x - t.x, e.y - t.y);
          if (d <= rangePx && e.progress > maxProg) {
            maxProg = e.progress;
            target = e;
          }
        }

        if (target) {
          t.angle = Math.atan2(target.y - t.y, target.x - t.x);
          if (t.timer <= 0) {
            t.timer = t.cooldown;
            projectiles.push({
              x: t.x,
              y: t.y,
              target,
              speed: t.projSpeed * cellSize,
              damage: t.damage,
              slow: t.slow,
              color: t.color
            });
          }
        }
      }

      // 투사체 이동 및 피격
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (!enemies.includes(p.target)) {
          projectiles.splice(i, 1);
          continue;
        }
        const dx = p.target.x - p.x;
        const dy = p.target.y - p.y;
        const dist = Math.hypot(dx, dy);

        if (dist <= p.speed * dt + 6) {
          p.target.hp -= p.damage;
          if (p.slow > 0) {
            p.target.slowTimer = 2.0;
            p.target.slowFactor = p.slow;
          }
          spawnParticles(p.target.x, p.target.y, p.color, 4);

          if (p.target.hp <= 0) {
            const idx = enemies.indexOf(p.target);
            if (idx !== -1) {
              gold += p.target.reward;
              spawnParticles(p.target.x, p.target.y, '#fbbf24', 10);
              addFloatingText(p.target.x, p.target.y, `+${p.target.reward}`, '#fbbf24');
              enemies.splice(idx, 1);
              updateHUD();
            }
          }
          projectiles.splice(i, 1);
        } else {
          p.x += (dx / dist) * p.speed * dt;
          p.y += (dy / dist) * p.speed * dt;
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= dt;
        if (pt.life <= 0) particles.splice(i, 1);
      }
      for (let i = floatingTexts.length - 1; i >= 0; i--) {
        const ft = floatingTexts[i];
        ft.y -= 22 * dt;
        ft.life -= dt;
        if (ft.life <= 0) floatingTexts.splice(i, 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let c = 0; c < COLS; c++) {
        for (let r = 0; r < ROWS; r++) {
          const isPath = pathSet.has(`${c},${r}`);
          ctx.fillStyle = isPath ? '#1e293b' : '#0f172a';
          ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          ctx.strokeStyle = '#162033';
          ctx.lineWidth = 1;
          ctx.strokeRect(c * cellSize, r * cellSize, cellSize, cellSize);
        }
      }

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = cellSize * 0.22;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      WAYPOINTS.forEach((wp, idx) => {
        const x = (wp.c + 0.5) * cellSize;
        const y = (wp.r + 0.5) * cellSize;
        if (idx === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      ctx.fillStyle = '#22c55e';
      ctx.beginPath();
      ctx.arc((WAYPOINTS[0].c + 0.5) * cellSize, (WAYPOINTS[0].r + 0.5) * cellSize, cellSize * 0.25, 0, Math.PI * 2);
      ctx.fill();

      const lastWp = WAYPOINTS[WAYPOINTS.length - 1];
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((lastWp.c + 0.5) * cellSize, (lastWp.r + 0.5) * cellSize, cellSize * 0.3, 0, Math.PI * 2);
      ctx.fill();

      if (selectedTower) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.12)';
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(selectedTower.x, selectedTower.y, selectedTower.range * cellSize, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }

      for (const t of towers) {
        ctx.save();
        ctx.translate(t.x, t.y);

        ctx.fillStyle = '#334155';
        ctx.beginPath();
        ctx.arc(0, 0, cellSize * 0.38, 0, Math.PI * 2);
        ctx.fill();

        ctx.rotate(t.angle);
        ctx.fillStyle = t.color;
        ctx.fillRect(0, -cellSize * 0.09, cellSize * 0.42, cellSize * 0.18);

        ctx.beginPath();
        ctx.arc(0, 0, cellSize * 0.26, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, Math.floor(cellSize * 0.28))}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText(`L${t.level}`, t.x, t.y + cellSize * 0.44);
      }

      for (const e of enemies) {
        const radius = e.isBoss ? cellSize * 0.36 : cellSize * 0.24;
        ctx.fillStyle = e.slowTimer > 0 ? '#67e8f9' : (e.isBoss ? '#f59e0b' : '#f43f5e');
        ctx.beginPath();
        ctx.arc(e.x, e.y, radius, 0, Math.PI * 2);
        ctx.fill();

        const barW = radius * 2.2;
        const barH = 4;
        const hpRatio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(e.x - barW / 2, e.y - radius - 8, barW, barH);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(e.x - barW / 2, e.y - radius - 8, barW * hpRatio, barH);
      }

      for (const p of projectiles) {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const pt of particles) {
        ctx.globalAlpha = Math.max(0, pt.life * 2);
        ctx.fillStyle = pt.color;
        ctx.fillRect(pt.x - 2, pt.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      for (const ft of floatingTexts) {
        ctx.globalAlpha = Math.min(1, ft.life * 1.5);
        ctx.fillStyle = ft.color;
        ctx.font = 'bold 13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(ft.text, ft.x, ft.y);
      }
      ctx.globalAlpha = 1;
    }

    let lastTime = performance.now();
    function loop(now) {
      const rawDt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(rawDt * gameSpeed);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
